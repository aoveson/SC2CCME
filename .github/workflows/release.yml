name: Build and Publish

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release_type:
        description: "Publish a Pre-Release or Stable Release"
        required: true
        default: prerelease
        type: choice
        options:
          - prerelease
          - release
      windows:
        description: "Build for Windows"
        required: false
        default: true
        type: boolean
      linux:
        description: "Build for Linux"
        required: false
        default: true
        type: boolean
      macos:
        description: "Build for macOS"
        required: false
        default: true
        type: boolean

env:
  BASE_VERSION: "1.0"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.inputs.outputs.version }}
      release_type: ${{ steps.inputs.outputs.release_type }}
      platforms: ${{ steps.inputs.outputs.platforms }}
      matrix: ${{ steps.inputs.outputs.matrix }}
    steps:
      - name: Validate Release Inputs and Create Platform Matrix
        id: inputs
        env:
          BASE_VERSION: ${{ env.BASE_VERSION }}
          RUN_NUMBER: ${{ github.run_number }}
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TYPE_INPUT: ${{ inputs.release_type }}
          # Map checkbox inputs (defaults to true on push / fallback)
          WIN_INPUT: ${{ github.event_name == 'push' || inputs.windows }}
          LINUX_INPUT: ${{ github.event_name == 'push' || inputs.linux }}
          MACOS_INPUT: ${{ github.event_name == 'push' || inputs.macos }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          const baseVersion = process.env.BASE_VERSION.replace(/^[vV]/, '');
          if (!/^\d+\.\d+$/.test(baseVersion)) {
            throw new Error(`BASE_VERSION must be MAJOR.MINOR (e.g., 1.0), got: ${process.env.BASE_VERSION}`);
          }
          const version = `${baseVersion}.${process.env.RUN_NUMBER}`;
          const releaseType = process.env.EVENT_NAME === 'push'
            ? 'prerelease'
            : process.env.RELEASE_TYPE_INPUT;
          if (!['prerelease', 'release'].includes(releaseType)) {
            throw new Error(`Unsupported release type: ${releaseType}`);
          }

          const supported = {
            windows: { platform: 'windows', runner: 'windows-latest', rid: 'win-x64' },
            linux: { platform: 'linux', runner: 'ubuntu-latest', rid: 'linux-x64' },
            macos: { platform: 'macos', runner: 'macos-15', rid: 'osx-arm64' },
          };

          // Collect selected platforms based on checkboxes
          const selected = [];
          if (String(process.env.WIN_INPUT) === 'true') selected.push('windows');
          if (String(process.env.LINUX_INPUT) === 'true') selected.push('linux');
          if (String(process.env.MACOS_INPUT) === 'true') selected.push('macos');

          if (selected.length === 0) {
            throw new Error('Invalid platforms: You must select at least one platform checkbox.');
          }

          // Exclude macOS from the matrix-driven package job since it has its own dedicated jobs
          const matrixSelected = selected.filter(p => p !== 'macos');
          const matrix = matrixSelected.map(platform => supported[platform]);

          fs.appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `release_type=${releaseType}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `platforms=${JSON.stringify(selected)}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `matrix=${JSON.stringify({ include: matrix })}\n`);
          NODE

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write # Required for test-reporter to create check runs / summaries
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Run xUnit Tests, Collect Coverage, and Output TRX
        run: >-
          dotnet test SC2CCME.slnx
          --configuration Release
          --collect:"XPlat Code Coverage"
          --logger "trx"
          --results-directory "$RUNNER_TEMP/TestResults"

      - name: Publish Unit Test Results to GitHub Summary
        if: always()
        uses: dorny/test-reporter@v3
        with:
          name: .NET Unit Test Results
          path: '${{ runner.temp }}/TestResults/**/*.trx'
          reporter: dotnet-trx
          fail-on-error: true

      - name: Upload Raw Coverage Results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: raw-coverage-${{ github.run_id }}
          path: ${{ runner.temp }}/TestResults/**/coverage.cobertura.xml
          if-no-files-found: error
          retention-days: 7

  coverage-report:
    name: Coverage Report
    needs: unit-tests
    runs-on: ubuntu-latest
    steps:
      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Download raw coverage results
        uses: actions/download-artifact@v8
        with:
          name: raw-coverage-${{ github.run_id }}
          path: ${{ runner.temp }}/TestResults

      - name: Install ReportGenerator
        run: dotnet tool install dotnet-reportgenerator-globaltool --tool-path "$RUNNER_TEMP/reportgenerator" --version 5.4.3

      - name: Generate HTML and Cobertura reports
        run: >-
          "$RUNNER_TEMP/reportgenerator/reportgenerator"
          "-reports:$RUNNER_TEMP/TestResults/**/coverage.cobertura.xml"
          "-targetdir:$RUNNER_TEMP/CoverageReport"
          "-reporttypes:Html;Cobertura;MarkdownSummaryGithub"

      - name: Add Coverage Summary to Workflow
        run: cat "$RUNNER_TEMP/CoverageReport/SummaryGithub.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report-${{ github.run_id }}
          path: ${{ runner.temp }}/CoverageReport/
          if-no-files-found: error
          retention-days: 14

  package-matrix:
    name: Package (${{ matrix.platform }})
    needs: [prepare, unit-tests]
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Install Linux AppImage Dependency
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes squashfs-tools

      - name: Package Windows
        if: matrix.platform == 'windows'
        shell: pwsh
        run: ./BuildScripts/build-windows.ps1 "${{ needs.prepare.outputs.version }}" win-x64

      - name: Package Linux
        if: matrix.platform == 'linux'
        run: bash BuildScripts/build-linux.sh "${{ needs.prepare.outputs.version }}" linux-x64

      - name: Upload Velopack Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: velopack-release-${{ matrix.platform }}-${{ needs.prepare.outputs.version }}
          path: BuildScripts/artifacts/${{ matrix.rid }}/releases/
          if-no-files-found: error
          retention-days: 7

  package-macos-primary:
    name: Package macOS (Primary - macos-latest)
    needs: [prepare, unit-tests]
    if: contains(needs.prepare.outputs.platforms, 'macos')
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Package macOS
        run: bash BuildScripts/build-macos.sh "${{ needs.prepare.outputs.version }}" osx-arm64

      - name: Upload Velopack Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: velopack-release-macos-${{ needs.prepare.outputs.version }}
          path: BuildScripts/artifacts/osx-arm64/releases/
          if-no-files-found: error
          retention-days: 7

  package-macos-fallback:
    name: Package macOS (Fallback - macos-14)
    needs: [prepare, unit-tests, package-macos-primary]
    if: always() && contains(needs.prepare.outputs.platforms, 'macos') && needs.package-macos-primary.result == 'failure'
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Package macOS
        run: bash BuildScripts/build-macos.sh "${{ needs.prepare.outputs.version }}" osx-arm64

      - name: Upload Velopack Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: velopack-release-macos-${{ needs.prepare.outputs.version }}
          path: BuildScripts/artifacts/osx-arm64/releases/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish
    needs: [prepare, package-matrix, package-macos-primary, package-macos-fallback]
    if: always() && needs.prepare.result == 'success' && (needs.package-matrix.result == 'success' || needs.package-matrix.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Install Pinned VPK CLI
        shell: bash
        run: dotnet tool install vpk --tool-path "$RUNNER_TEMP/vpk" --version 1.2.161

      - name: Download Platform Packages
        uses: actions/download-artifact@v8
        with:
          pattern: velopack-release-*-${{ needs.prepare.outputs.version }}
          path: ${{ runner.temp }}/velopack-releases
          merge-multiple: false

      - name: Merge Platform Assets Into GitHub Release
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_TYPE: ${{ needs.prepare.outputs.release_type }}
          RELEASE_PLATFORMS: ${{ needs.prepare.outputs.platforms }}
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          readarray -t platforms < <(node -e 'for (const p of JSON.parse(process.env.RELEASE_PLATFORMS)) console.log(p)')
          total=${#platforms[@]}
          index=0

          for platform in "${platforms[@]}"; do
            case "$platform" in
              windows) directive='[win]' ;;
              linux) directive='[linux]' ;;
              macos) directive='[osx]' ;;
              *) echo "Unsupported platform: $platform" >&2; exit 1 ;;
            esac

            release_dir="$RUNNER_TEMP/velopack-releases/velopack-release-$platform-$RELEASE_VERSION"
            
            if [ ! -d "$release_dir" ]; then
              echo "Error: Directory $release_dir does not exist."
              exit 1
            fi

            args=("$directive" upload github
              --repoUrl "https://github.com/$GH_REPOSITORY"
              --token "$GH_TOKEN"
              --outputDir "$release_dir"
              --tag "v$RELEASE_VERSION"
              --targetCommitish "$RELEASE_COMMIT"
              --merge)

            if (( index == total - 1 )); then
              args+=(--publish)
            fi

            if [[ "$RELEASE_TYPE" == "prerelease" ]]; then
              args+=(--pre)
            fi

            echo "Uploading $platform using directive $directive from $release_dir..."
            "$RUNNER_TEMP/vpk/vpk" "${args[@]}"
            
            index=$((index + 1))
          done